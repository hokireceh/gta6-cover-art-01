<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Panels — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Panels</h1>
    <p class="tag">Turn your photos into GTA-style multi-panel cover art. Everything stays on your machine — photos are never uploaded.</p>
    <div class="group">
      <h2>1 · Photos</h2>
      <label>Choose a photo <input id="photo" type="file" accept="image/*"></label>
      <div class="row">
        <button type="button" data-sample="pier">Sample: Pier</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
      </div>
      <label>Apply photo to
        <select id="scope">
          <option value="selected">Selected panel</option>
          <option value="all">All panels</option>
        </select>
      </label>
      <p class="hint">Click a panel in the preview to select it, drag it to move its photo, scroll over it to zoom.</p>
    </div>
    <div class="group">
      <h2>2 · Panels</h2>
      <div class="row" role="group" aria-label="Choose a panel">
        <button type="button" data-panel="0" class="active">1 Hero</button>
        <button type="button" data-panel="1">2</button>
        <button type="button" data-panel="2">3</button>
        <button type="button" data-panel="3">4</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
      <button id="center" type="button">Centre photo</button>
    </div>
    <div class="group">
      <h2>3 · Words &amp; grade</h2>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="40" value="A neon story"></label>
      <label>Sunset grade <input id="grade" type="range" min="0" max="100" step="1" value="70"></label>
    </div>
    <div class="group">
      <h2>4 · Export</h2>
      <div class="row" role="group" aria-label="Export size">
        <button type="button" data-size="1080x1080">1080 × 1080</button>
        <button type="button" data-size="1080x1350" class="active">1080 × 1350</button>
        <button type="button" data-size="1920x1080">1920 × 1080</button>
      </div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1350" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
