<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Panels — GTA 6-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
  <aside class="panel" aria-label="Cover controls">
    <h1>Neon Panels</h1>
    <p class="lede">Your photos, four slanted panels, one sunset-neon cover.</p>

    <fieldset>
      <legend>Photos — one per panel</legend>
      <label class="pick">Panel 1 <input id="file0" type="file" accept="image/*"></label>
      <label class="pick">Panel 2 <input id="file1" type="file" accept="image/*"></label>
      <label class="pick">Panel 3 <input id="file2" type="file" accept="image/*"></label>
      <label class="pick">Panel 4 <input id="file3" type="file" accept="image/*"></label>
      <label class="pick">One photo for all panels <input id="fileAll" type="file" accept="image/*"></label>
      <button id="samples" type="button">Load the sample photos</button>
      <p class="hint">Click a panel in the preview to select it, then drag to move its photo and scroll to zoom it.</p>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label class="pick">Caption <input id="caption" type="text" maxlength="24" value="VICE CITY"></label>
      <label class="pick">Tagline <input id="tagline" type="text" maxlength="40" value="NEON NIGHTS"></label>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <label class="pick">Layout
        <select id="layout">
          <option value="quad" selected>Quad — four panels</option>
          <option value="hero">Hero — one big panel, two small</option>
        </select>
      </label>
      <label class="pick">Grade
        <select id="grade">
          <option value="sunset" selected>Sunset</option>
          <option value="neon">Neon</option>
          <option value="dusk">Dusk</option>
        </select>
      </label>
      <label class="pick">Export size
        <select id="size">
          <option value="1080x1080">1080 × 1080 — square</option>
          <option value="1080x1350">1080 × 1350 — portrait</option>
          <option value="1920x1080" selected>1920 × 1080 — wide</option>
        </select>
      </label>
    </fieldset>

    <button id="export" type="button" class="big">Export PNG</button>
    <p id="status" role="status"></p>
  </aside>
  <main class="stage-wrap">
    <canvas id="stage" width="1920" height="1080" aria-label="The cover preview"></canvas>
  </main>
</div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
